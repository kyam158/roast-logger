<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">

<title>Roast Logger Pro</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-annotation@3.0.1"></script>

<style>
body{margin:0;font-family:-apple-system;background:#fafafa}
#container{min-height:100vh}
#chartWrap{height:45vh}
button,input,select{width:100%;padding:12px;margin:6px 0;font-size:16px}
.row{display:flex;gap:6px}
.row>*{flex:1}
#dropBtn{background:#d32f2f;color:#fff;font-weight:bold}
#csvBtn{background:#1976d2;color:#fff}
#time{text-align:center;font-size:22px;margin:6px 0}
#phaseText{text-align:center;font-size:18px;font-weight:bold;margin:4px 0}
button{touch-action:manipulation}

#logTableWrap,#eventTableWrap{max-height:18vh;overflow-y:auto;background:#fff;border-top:2px solid #000}
table{width:100%;border-collapse:collapse;font-size:12px}
th,td{border:1px solid #444;padding:2px;text-align:center}
thead{position:sticky;top:0;background:#000;color:#fff}
</style>
</head>

<body>
<div id="container">

<div id="chartWrap"><canvas id="chart"></canvas></div>
<div id="phaseText"></div>

<div id="logTableWrap">
<table id="logTable">
<thead><tr><th>Time</th><th>Temp</th><th>Gas</th><th>RoR</th></tr></thead>
<tbody></tbody>
</table>
</div>

<div id="eventTableWrap">
<table id="eventTable">
<thead><tr><th>Event</th><th>Time</th><th>Temp</th><th>Gas</th></tr></thead>
<tbody></tbody>
</table>
</div>

<div id="panel">
<div id="time">0:00</div>

<label>開始温度</label>
<input id="startTempInput" type="number" value="150">
<button id="startBtn">焙煎開始</button>

<label>豆温</label>
<div class="row">
<input id="tempInput" type="number" value="150">
<button id="tempSet">決定</button>
</div>

<label>Gas</label>
<div class="row">
<button id="gasDown">−</button>
<div id="gasLabel" style="text-align:center;font-size:20px">2.5</div>
<button id="gasUp">＋</button>
</div>

<div class="row">
<input id="gasInput" type="number" step="0.1" value="2.5">
<button id="gasSet">決定</button>
</div>

<button id="chargeBtn">Charge</button>
<button id="dryBtn">Dry End</button>
<button id="fcBtn">1st Crack</button>
<button id="dropBtn">DROP</button>

<button id="csvBtn">CSV Export</button>
<input id="loadCsv" type="file" accept=".csv">
</div>
</div>

<script>
Chart.register(window['chartjs-plugin-annotation']);
const fmt=s=>`${Math.floor(s/60)}:${String(s%60).padStart(2,"0")}`;
const secToMinSec=fmt;

/* ===== 状態 ===== */
let startTime=null,endTime=null,timer=null;
let temp=150,gas=2.5,startTemp=150;
const tempData=[],gasData=[],rorData=[];
let chargeTime=null,dryTime=null,fcTime=null,dropTime=null;
const nowSec=()=>endTime??Math.floor((Date.now()-startTime)/1000);

/* ===== Phase Ratio ===== */
function calcPhaseRatio(){
 if(!chargeTime||!dryTime||!fcTime||!dropTime) return null;
 const drying=dryTime-chargeTime;
 const maillard=fcTime-dryTime;
 const dev=dropTime-fcTime;
 const total=dropTime-chargeTime;
 const pct=n=>(n/total*100).toFixed(1);
 return {
  dryingPct:pct(drying),maillardPct:pct(maillard),devPct:pct(dev),
  dryingTime:secToMinSec(drying),
  maillardTime:secToMinSec(maillard),
  devTime:secToMinSec(dev),
  totalTime:secToMinSec(total)
 };
}

/* ===== Chart ===== */
const chart=new Chart(document.getElementById("chart"),{
 type:"line",
 data:{datasets:[
  {label:"Temp",data:[],borderColor:"red",borderWidth:3,tension:.3,pointRadius:0},
  {label:"RoR",data:[],yAxisID:"y2",borderColor:"blue",borderWidth:2,pointRadius:0},
  {label:"Gas",data:[],yAxisID:"y3",borderColor:"green",borderDash:[4,4],pointRadius:0}
 ]},
 options:{
  animation:false,
  scales:{
   x:{type:"linear",ticks:{callback:v=>`${Math.floor(v/60)}:00`}},
   y:{min:0,max:260},
   y2:{position:"right",min:0,max:40,grid:{drawOnChartArea:false}},
   y3:{position:"right",min:0,max:5,grid:{drawOnChartArea:false}}
  }
 }
});

/* ===== RoR ===== */
function calcRoR(){
 rorData.length=0;
 for(let i=1;i<tempData.length;i++){
  const p=tempData[i-1],c=tempData[i];
  const dt=c.x-p.x;if(dt<=0)continue;
  rorData.push({x:c.x,y:+((c.y-p.y)*(60/dt)).toFixed(1)});
 }
}

/* ===== Log Table ===== */
function updateLogTable(){
 const tb=document.querySelector("#logTable tbody");
 tb.innerHTML="";
 for(let s=0;s<=nowSec();s+=60){
  const t=[...tempData].reverse().find(d=>d.x<=s);
  const g=[...gasData].reverse().find(d=>d.x<=s);
  const r=[...rorData].reverse().find(d=>d.x<=s);
  const tr=document.createElement("tr");
  tr.innerHTML=`<td>${fmt(s)}</td><td>${t?t.y:""}</td><td>${g?g.y:""}</td><td>${r?r.y:""}</td>`;
  tb.appendChild(tr);
 }
}

/* ===== Event Log ===== */
function addEvent(name){
 const tb=document.querySelector("#eventTable tbody");
 const tr=document.createElement("tr");
 tr.innerHTML=`<td>${name}</td><td>${fmt(nowSec())}</td><td>${temp}</td><td>${gas}</td>`;
 tb.appendChild(tr);
}

/* ===== Draw ===== */
function draw(){
 if(!startTime)return;
 const t=nowSec();
 time.textContent=fmt(t);
 chart.options.scales.x.max=Math.max(600,t+10);

 calcRoR();
 chart.data.datasets[0].data=tempData;
 chart.data.datasets[1].data=rorData;
 chart.data.datasets[2].data=gasData;

 updateLogTable();
 chart.update();
}

/* ===== Controls ===== */
startBtn.onclick=()=>{
 startTemp=parseInt(startTempInput.value)||150;
 temp=startTemp;
 startTime=Date.now();endTime=null;
 tempData.length=gasData.length=rorData.length=0;
 chargeTime=dryTime=fcTime=dropTime=null;
 document.querySelector("#eventTable tbody").innerHTML="";
 tempData.push({x:0,y:startTemp});
 gasData.push({x:0,y:gas});
 clearInterval(timer);
 timer=setInterval(draw,1000);
 draw();
};

tempSet.onclick=()=>{
 temp=parseInt(tempInput.value);
 tempData.push({x:nowSec(),y:temp});
 draw();
};

const setGas=v=>{
 gas=Math.max(0,Math.min(5,Number(v.toFixed(1))));
 gasLabel.textContent=gas;gasInput.value=gas;
 gasData.push({x:nowSec(),y:gas});
 addEvent("Gas");
 draw();
};
gasUp.onclick=()=>setGas(gas+0.1);
gasDown.onclick=()=>setGas(gas-0.1);
gasSet.onclick=()=>setGas(parseFloat(gasInput.value));

chargeBtn.onclick=()=>{chargeTime=nowSec();addEvent("Charge");};
dryBtn.onclick=()=>{dryTime=nowSec();addEvent("Dry End");};
fcBtn.onclick=()=>{fcTime=nowSec();addEvent("1st Crack");};

dropBtn.onclick=()=>{
 dropTime=nowSec();endTime=dropTime;
 addEvent("Drop");clearInterval(timer);draw();

 const r=calcPhaseRatio();
 if(r){
  phaseText.innerHTML=`
  Drying: ${r.dryingPct}% (${r.dryingTime})<br>
  Maillard: ${r.maillardPct}% (${r.maillardTime})<br>
  Development: ${r.devPct}% (${r.devTime})<br>
  Total: ${r.totalTime}`;
 }
};

/* ===== CSV Export ===== */
csvBtn.onclick=()=>{
 let csv=["# Roast Logger CSV"];
 const r=calcPhaseRatio();
 if(r){
  csv.push(`# DryingTime,${r.dryingTime}`);
  csv.push(`# MaillardTime,${r.maillardTime}`);
  csv.push(`# DevelopmentTime,${r.devTime}`);
  csv.push(`# TotalTime,${r.totalTime}`);
  csv.push(`# DryingRate,${r.dryingPct}%`);
  csv.push(`# MaillardRate,${r.maillardPct}%`);
  csv.push(`# DevelopmentRate,${r.devPct}%`);
 }
 csv.push("Time,Temp,Gas,RoR");
 for(let i=0;i<tempData.length;i++){
  const t=tempData[i];
  const g=gasData.find(d=>d.x==t.x);
  const ror=rorData.find(d=>d.x==t.x);
  csv.push(`${fmt(t.x)},${t.y},${g?g.y:""},${ror?ror.y:""}`);
 }
 const blob=new Blob([csv.join("\n")],{type:"text/csv"});
 const a=document.createElement("a");
 a.href=URL.createObjectURL(blob);
 a.download=`roast_${Date.now()}.csv`;
 a.click();
};

/* ===== CSV Import ===== */
loadCsv.onchange=e=>{
 const file=e.target.files[0]; if(!file)return;
 const reader=new FileReader();
 reader.onload=ev=>{
  const lines=ev.target.result.split("\n");
  tempData.length=gasData.length=rorData.length=0;
  for(let l of lines){
   if(!l||l.startsWith("#")||l.startsWith("Time"))continue;
   const [time,t,g,r]=l.split(",");
   const [m,s]=time.split(":").map(Number);
   const sec=m*60+s;
   if(t)tempData.push({x:sec,y:+t});
   if(g)gasData.push({x:sec,y:+g});
   if(r)rorData.push({x:sec,y:+r});
  }
  chart.data.datasets[0].data=tempData;
  chart.data.datasets[1].data=rorData;
  chart.data.datasets[2].data=gasData;
  chart.update();
  alert("CSV Loaded");
 };
 reader.readAsText(file);
};
</script>
</body>
</html>
