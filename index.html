<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<!-- iPhone/iPad ズーム防止（強力） -->
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Roast Logger Pro FujiRoyal 1kg</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-annotation@3.0.1"></script>

<style>
/* ===== base ===== */
html,body{
  margin:0;
  -webkit-text-size-adjust:100%; /* iOS での自動文字拡大を抑える */
  touch-action:manipulation;
  font-family:-apple-system, BlinkMacSystemFont, "Helvetica Neue", "Segoe UI", Roboto, "Noto Sans JP", "Hiragino Kaku Gothic ProN", "メイリオ", sans-serif;
  background:#fafafa;
}
#container{min-height:100vh;}

/* chart / controls */
#chartWrap{height:45vh}
button,input,select,textarea{width:100%;padding:12px;margin:6px 0;font-size:16px;box-sizing:border-box}
.row{display:flex;gap:6px}
.row>*{flex:1}
#dropBtn{background:#d32f2f;color:#fff;font-weight:bold}
#csvBtn{background:#1976d2;color:#fff}
#time{text-align:center;font-size:22px;margin:6px 0}
#phaseText{text-align:center;font-size:16px;font-weight:bold}
button{touch-action:manipulation}

/* tables */
#logTableWrap,#eventTableWrap{max-height:20vh;overflow:auto;background:#fff;margin-top:8px}
table{width:100%;border-collapse:collapse;font-size:12px}
th,td{border:1px solid #444;padding:2px;text-align:center}
thead{position:sticky;top:0;background:#000;color:#fff}

/* inputs — 強制16pxでズーム防止 */
input, textarea, select { font-size:16px !important; -webkit-appearance:none; }

/* bottom spacer */
#bottomSpacer{height:120px}

/* small layout for history controls inline */
.history-controls{display:flex;gap:6px;align-items:center}
.history-controls>*{flex:1}

/* ===== iPad 横並びレイアウト =====
   body.ipad が付いたときだけ左右2カラムにする
*/
body.ipad #container{
  display:flex;
  flex-direction:row;
  height:100vh;
  gap:12px;
  padding:10px 12px;
  box-sizing:border-box;
}

/* 左カラム：グラフ + 表（固定、スクロールせず右パネルだけスクロール） */
body.ipad #leftCol{
  flex:1.4;
  min-width:420px; /* 任意：狭くなりすぎるのを防ぐ */
  overflow:hidden; /* 左はスクロールさせない */
  display:flex;
  flex-direction:column;
  gap:8px;
}

/* 右カラム：操作パネル（スクロール可） */
body.ipad #rightCol{
  flex:0.95;
  min-width:360px;
  max-width:520px;
  background:#fff;
  border-radius:6px;
  padding:8px 12px;
  box-shadow:0 2px 8px rgba(0,0,0,0.06);
  overflow:auto;
  -webkit-overflow-scrolling:touch;
}

/* iPad のグラフ高さを左カラムに合わせて調整（余裕を持たせる） */
body.ipad #chartWrap{height:48vh}

/* モバイル（iPhone等）は従来表示 */
@media (max-width:900px){
  body.ipad #leftCol{min-width:0}
  body.ipad #rightCol{min-width:0;max-width:none}
}
</style>
</head>

<body>
<div id="container">

  <!-- 左カラム：グラフ + 表（iPad時は左に固定表示） -->
  <div id="leftCol">
    <div id="chartWrap"><canvas id="chart"></canvas></div>
    <div id="phaseText">Phase: waiting...</div>

    <div id="logTableWrap">
      <table id="logTable">
        <thead><tr><th>Time</th><th>Temp</th><th>Gas</th><th>Air</th><th>RoR</th></tr></thead>
        <tbody></tbody>
      </table>
    </div>

    <div id="eventTableWrap">
      <table id="eventTable">
        <thead><tr><th>Event</th><th>Time</th><th>Temp</th><th>Gas</th><th>Air</th></tr></thead>
        <tbody></tbody>
      </table>
    </div>
  </div>

  <!-- 右カラム：操作パネル（スクロール可） -->
  <div id="rightCol">
    <div id="panel">
      <div id="time">0:00</div>

      <label>開始温度</label>
      <input id="startTempInput" type="number" value="150">
      <button id="startBtn">焙煎開始</button>

      <label>豆温</label>
      <div class="row">
        <input id="tempInput" type="number" value="150">
        <button id="tempSet">決定</button>
      </div>

      <label>Gas</label>
      <div class="row">
        <button id="gasDown">−</button>
        <div id="gasLabel">2.5</div>
        <button id="gasUp">＋</button>
      </div>
      <div class="row">
        <input id="gasInput" type="number" step="0.1" value="2.5">
        <button id="gasSet">決定</button>
      </div>

      <label>Air</label>
      <div class="row">
        <button id="airDown">−</button>
        <div id="airLabel">0.0</div>
        <button id="airUp">＋</button>
      </div>
      <div class="row">
        <input id="airInput" type="number" step="0.1" value="0.0">
        <button id="airSet">決定</button>
      </div>

      <button id="tpBtn">Turning Point</button>
      <button id="dryBtn">Dry End（長押し）</button>
      <button id="fcBtn">1st Crack（長押し）</button>
      <button id="dropBtn">DROP</button>

      <button id="csvBtn">CSV Export</button>
      <input id="loadCsv" type="file" accept=".csv">

      <!-- 履歴セレクト + 履歴操作 -->
      <div class="history-controls">
        <select id="historySelect"><option value="">履歴</option></select>
        <button id="exportHistoryBtn">Export Selected</button>
      </div>
      <div class="history-controls">
        <input id="historyName" placeholder="履歴名 (編集)" />
        <button id="renameHistoryBtn">Rename</button>
        <button id="deleteHistoryBtn">Delete Selected</button>
      </div>

      <!-- 比較セレクト（追加） -->
      <div class="history-controls">
        <select id="compareSelect"><option value="">比較（Compare）</option></select>
        <button id="clearCompareBtn">Clear Compare</button>
      </div>

      <h3>Green Bean Info</h3>
      <label>日付</label><input id="metaDate" type="date">
      <label>国</label><input id="metaCountry">
      <label>農園</label><input id="metaFarm">
      <label>品種</label><input id="metaVariety">
      <label>プロセス</label><input id="metaProcess">
      <label>標高</label><input id="metaAltitude">

      <div id="bottomSpacer"></div>
    </div>
  </div>

</div>

<script>
/* iPad 判定：body.ipad を付ける（表示レイアウトを CSS で切り替え） */
(function(){
  const isIPad = navigator.userAgent.includes("iPad") ||
    (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
  if(isIPad) document.body.classList.add("ipad");
})();

/* ========== ここから既存ロジック（変更なし） ========== */
Chart.register(window['chartjs-plugin-annotation']);
const fmt = s => `${Math.floor(s/60)}:${String(s%60).padStart(2,"0")}`;
const secToMinSec = fmt;
function minSecToSec(str){
 if(!str) return null;
 const v = (""+str).trim();
 const parts = v.split(":").map(Number);
 if(parts.length!==2) return null;
 const [m,s] = parts;
 if(isNaN(m) || isNaN(s)) return null;
 return m*60 + s;
}

/* state */
let startTime=null,endTime=null,timer=null;
let temp=150,gas=2.5,air=0;
const tempData=[],gasData=[],airData=[],rorData=[];
let tpTime=null,dryTime=null,fcTime=null,dropTime=null;

const minuteLog = [];
const eventLog = [];
let lastMinuteLogged = -1;
const nowSec = ()=> endTime ?? Math.floor((Date.now()-startTime)/1000);

/* Chart plugin: draw big phase info on canvas */
const phaseOverlayPlugin = {
  id: 'phaseOverlay',
  afterDraw(chart){
    const ctx = chart.ctx;
    const area = chart.chartArea;
    const ratio = (function(){
      if(tpTime==null || dryTime==null || fcTime==null || dropTime==null) return null;
      const drying = dryTime - tpTime;
      const maillard = fcTime - dryTime;
      const dev = dropTime - fcTime;
      const total = dropTime - tpTime;
      if(total<=0) return null;
      return {
        drying, maillard, dev,
        dryingPct: (drying/total*100).toFixed(1),
        maillardPct: (maillard/total*100).toFixed(1),
        devPct: (dev/total*100).toFixed(1),
        devTime: secToMinSec(dev)
      };
    })();
    ctx.save();
    ctx.font = "bold 16px sans-serif";
    ctx.fillStyle = "rgba(0,0,0,0.6)";
    ctx.textBaseline = "top";

    if(ratio){
      const text = `Dry ${ratio.dryingPct}%  |  Mail ${ratio.maillardPct}%  |  Dev ${ratio.devPct}% (${ratio.devTime})`;
      const x = area.left + 8;
      const y = area.top + 8;
      ctx.fillStyle = "rgba(255,255,255,0.9)";
      const w = ctx.measureText(text).width + 18;
      ctx.fillRect(x-6, y-6, w, 34);
      ctx.fillStyle = "#111";
      ctx.font = "bold 13px sans-serif";
      ctx.fillText(text, x, y);
    } else {
      const parts = [];
      if(tpTime) parts.push(`TP ${secToMinSec(tpTime)}`);
      if(dryTime) parts.push(`Dry ${secToMinSec(dryTime)}`);
      if(fcTime) parts.push(`1C ${secToMinSec(fcTime)}`);
      if(dropTime) parts.push(`Drop ${secToMinSec(dropTime)}`);
      if(parts.length){
        const text = parts.join(" | ");
        const x = area.left + 8;
        const y = area.top + 8;
        ctx.fillStyle = "rgba(255,255,255,0.9)";
        const w = ctx.measureText(text).width + 18;
        ctx.fillRect(x-6, y-6, w, 24);
        ctx.fillStyle = "#111";
        ctx.font = "12px sans-serif";
        ctx.fillText(text, x, y);
      }
    }
    ctx.restore();
  }
};

/* Chart - add Compare dataset (index 4) */
const chart = new Chart(document.getElementById("chart"),{
  plugins:[phaseOverlayPlugin],
  type:"line",
  data:{datasets:[
    {label:"Temp",data:[],borderColor:"red",borderWidth:2,pointRadius:0},
    {label:"RoR",data:[],yAxisID:"yRoR",borderColor:"blue",borderWidth:2,pointRadius:0},
    {label:"Gas",data:[],yAxisID:"yGas",borderColor:"green",borderDash:[4,4],pointRadius:0},
    {label:"Air",data:[],yAxisID:"yAir",borderColor:"cyan",borderDash:[2,2],pointRadius:0},
    {label:"Compare",data:[],borderColor:"#666",borderDash:[6,4],borderWidth:2,pointRadius:0,hidden:true}
  ]},
  options:{
    animation:false,
    scales:{
      x:{type:"linear",ticks:{callback:v=>fmt(v)}},
      y:{min:0,max:260},
      yRoR:{position:"right",min:0,max:40},
      yGas:{position:"right",min:0,max:5,offset:true},
      yAir:{position:"right",min:0,max:10,offset:true}
    },
    plugins:{annotation:{annotations:{}}}
  }
});

/* RoR calc */
function calcRoR(){
 rorData.length=0;
 for(let i=1;i<tempData.length;i++){
  const p=tempData[i-1],c=tempData[i];
  const dt=c.x-p.x;if(dt<=0)continue;
  rorData.push({x:c.x,y:+((c.y-p.y)*60/dt).toFixed(1)});
 }
}

/* Event log */
function addEventLog(name){
 const t = nowSec();
 const tempRec = [...tempData].reverse().find(d=>d.x<=t);
 const gasRec = [...gasData].reverse().find(d=>d.x<=t);
 const airRec = [...airData].reverse().find(d=>d.x<=t);
 const rec = {
  name,
  t,
  temp: tempRec ? Number(tempRec.y) : (temp? Number(temp) : ""),
  gas: gasRec ? Number(gasRec.y) : (gas? Number(gas) : ""),
  air: airRec ? Number(airRec.y) : (air? Number(air) : "")
 };
 eventLog.push(JSON.parse(JSON.stringify(rec)));
 const tbody = document.querySelector("#eventTable tbody");
 const tr = document.createElement("tr");
 tr.innerHTML = `<td>${rec.name}</td><td>${secToMinSec(rec.t)}</td><td>${rec.temp!==""?rec.temp:""}</td><td>${rec.gas!==""?rec.gas:""}</td><td>${rec.air!==""?rec.air:""}</td>`;
 tbody.appendChild(tr);
}

/* Minute log */
function updateMinuteLogIfNeeded(){
 if(!startTime) return;
 const s = nowSec();
 const min = Math.floor(s/60);
 if(min <= lastMinuteLogged) return;
 for(let m=lastMinuteLogged+1; m<=min; m++){
   const sec = m*60;
   const tRec = [...tempData].reverse().find(d=>d.x<=sec);
   const gRec = [...gasData].reverse().find(d=>d.x<=sec);
   const aRec = [...airData].reverse().find(d=>d.x<=sec);
   const rRec = [...rorData].reverse().find(d=>d.x<=sec);
   const rec = {
     min: m,
     time: secToMinSec(sec),
     temp: tRec? (Math.round(tRec.y)) : "",
     gas: gRec? gRec.y.toFixed(1) : "",
     air: aRec? aRec.y.toFixed(1) : "",
     ror: rRec? rRec.y.toFixed(1) : ""
   };
   minuteLog.push(JSON.parse(JSON.stringify(rec)));
   const tbody = document.querySelector("#logTable tbody");
   const tr = document.createElement("tr");
   tr.innerHTML = `<td>${rec.time}</td><td>${rec.temp}</td><td>${rec.gas}</td><td>${rec.air}</td><td>${rec.ror}</td>`;
   tbody.appendChild(tr);
 }
 lastMinuteLogged = min;
}

/* Phase ratio */
function calcPhaseRatio(){
 if(tpTime==null || dryTime==null || fcTime==null || dropTime==null) return null;
 const drying = dryTime - tpTime;
 const maillard = fcTime - dryTime;
 const dev = dropTime - fcTime;
 const total = dropTime - tpTime;
 if(total<=0) return null;
 const pct = n => (n/total*100).toFixed(1);
 return {
  drying, maillard, dev,
  dryingTime: fmt(drying),
  maillardTime: fmt(maillard),
  devTime: fmt(dev),
  dryingPct: pct(drying),
  maillardPct: pct(maillard),
  devPct: pct(dev)
 };
}

/* draw */
function draw(){
 if(!startTime) return;
 const t = nowSec();
 document.getElementById("time").textContent = fmt(t);
 calcRoR();
 chart.data.datasets[0].data = tempData;
 chart.data.datasets[1].data = rorData;
 chart.data.datasets[2].data = gasData;
 chart.data.datasets[3].data = airData;
 chart.options.scales.x.max = Math.max(600, t+10);

 // annotations
 const ann = chart.options.plugins.annotation.annotations = {};
 const addAnn = (k, time, label, color) => { if(time!=null) ann[k] = { type:"line", xMin: time, xMax: time, borderColor: color, borderWidth: 2, label: { display:true, content: label } }; };
 addAnn("tp", tpTime, "TP", "purple");
 addAnn("dry", dryTime, "Dry", "orange");
 addAnn("fc", fcTime, "1C", "red");
 addAnn("drop", dropTime, "Drop", "black");

 updateMinuteLogIfNeeded();
 const ratio = calcPhaseRatio();
 if(ratio){
  document.getElementById("phaseText").innerHTML =
   `Dry ${ratio.dryingTime} (${ratio.dryingPct}%) | Maillard ${ratio.maillardTime} (${ratio.maillardPct}%) | Dev ${ratio.devTime} (${ratio.devPct}%)`;
 } else {
  const parts = [];
  if(tpTime) parts.push(`TP ${secToMinSec(tpTime)}`);
  if(dryTime) parts.push(`Dry ${secToMinSec(dryTime)}`);
  if(fcTime) parts.push(`1C ${secToMinSec(fcTime)}`);
  if(dropTime) parts.push(`Drop ${secToMinSec(dropTime)}`);
  document.getElementById("phaseText").textContent = parts.length ? parts.join(" | ") : "Phase: waiting...";
 }

 chart.update();
}

/* Controls (existing behavior preserved) */
document.getElementById("startBtn").onclick = () => {
 startTime = Date.now(); endTime = null;
 tempData.length = gasData.length = airData.length = rorData.length = 0;
 minuteLog.length = eventLog.length = 0; lastMinuteLogged = -1;
 tpTime = dryTime = fcTime = dropTime = null;
 temp = +document.getElementById("startTempInput").value || 150;
 tempData.push({x:0,y:temp});
 gasData.push({x:0,y:gas});
 airData.push({x:0,y:air});
 document.querySelector("#logTable tbody").innerHTML = "";
 document.querySelector("#eventTable tbody").innerHTML = "";
 clearInterval(timer);
 timer = setInterval(draw,1000);
 draw();
};

document.getElementById("tempSet").onclick = () => {
 temp = +document.getElementById("tempInput").value || temp;
 tempData.push({x: nowSec(), y: temp});
 draw();
};

const setGas = v => {
 gas = Math.max(0, Math.min(5, Number((v).toFixed(1))));
 document.getElementById("gasLabel").textContent = gas.toFixed(1);
 document.getElementById("gasInput").value = gas.toFixed(1);
 gasData.push({x: nowSec(), y: gas});
 addEventLog("Gas Change");
 draw();
};
document.getElementById("gasUp").onclick = ()=> setGas(gas + 0.1);
document.getElementById("gasDown").onclick = ()=> setGas(gas - 0.1);
document.getElementById("gasSet").onclick = ()=> {
 const v = parseFloat(document.getElementById("gasInput").value);
 if(!isNaN(v)) setGas(v);
};

const setAir = v => {
 air = Math.max(0, Number((v).toFixed(1)));
 document.getElementById("airLabel").textContent = air.toFixed(1);
 document.getElementById("airInput").value = air.toFixed(1);
 airData.push({x: nowSec(), y: air});
 addEventLog("Air Change");
 draw();
};
document.getElementById("airUp").onclick = ()=> setAir(air + 0.1);
document.getElementById("airDown").onclick = ()=> setAir(air - 0.1);
document.getElementById("airSet").onclick = ()=> {
 const v = parseFloat(document.getElementById("airInput").value);
 if(!isNaN(v)) setAir(v);
};

// long-press Dry/1C
let hold = null;
const holdStart = f => hold = setTimeout(f, 600);
const holdCancel = () => { if(hold){ clearTimeout(hold); hold=null; } };
const dryBtn = document.getElementById("dryBtn");
const fcBtn = document.getElementById("fcBtn");
dryBtn.onpointerdown = e => { e.preventDefault(); holdStart(()=>{ dryTime = nowSec(); addEventLog("Dry End"); draw(); }); };
fcBtn.onpointerdown = e => { e.preventDefault(); holdStart(()=>{ fcTime = nowSec(); addEventLog("1st Crack"); draw(); }); };
[dryBtn, fcBtn].forEach(b => { b.onpointerup = holdCancel; b.onpointercancel = holdCancel; });

document.getElementById("tpBtn").onclick = () => { tpTime = nowSec(); addEventLog("Turning Point"); draw(); };

document.getElementById("dropBtn").onclick = () => {
 dropTime = nowSec(); endTime = dropTime;
 addEventLog("Drop");
 clearInterval(timer);
 draw();
 saveHistory();
};

/* History / CSV / import / export / compare  — existing code preserved (omitted here to keep message readable) */
/* ... (unchanged, same as previously provided) ... */

/* initialize */
updateHistory();
</script>
</body>
</html>
