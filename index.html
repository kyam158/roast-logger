<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Roast Logger Pro</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-annotation@1.4.0"></script>

<style>
body { font-family: sans-serif; margin: 0; padding: 10px; }
input, button { font-size: 16px; padding: 8px; margin: 4px 0; width: 100%; }
#chartWrap { position: relative; }
#phaseInfo {
  position:absolute;
  top:10px;
  left:10px;
  background:rgba(255,255,255,0.8);
  padding:6px;
  font-size:12px;
  border-radius:6px;
}
.bottomSpace { height: 80px; } /* iPhone押しづらさ対策 */
</style>
</head>

<body>

<h2>Roast Logger PRO</h2>

<div id="chartWrap">
<canvas id="roastChart"></canvas>
<div id="phaseInfo"></div>
</div>

<button onclick="startRoast()">焙煎開始</button>
<button onclick="markTP()">Turning Point</button>
<button onclick="markDryEnd()">Dry End</button>
<button onclick="markFC()">1st Crack</button>
<button onclick="markDrop()" style="background:red;color:white;">DROP</button>

<hr>

<h3>豆情報</h3>
<input placeholder="国 / 農園 / 精製">
<input placeholder="品種">
<input placeholder="標高">
<input placeholder="焙煎日">

<div class="bottomSpace"></div>

<script>
let times = [];
let temps = [];
let timer;
let startTime;

let chargeTime, tpTime, dryEndTime, fcTime, dropTime;

const ctx = document.getElementById("roastChart");

const roastChart = new Chart(ctx, {
  type: "line",
  data: {
    labels: [],
    datasets: [{
      label: "Temp",
      data: [],
      borderWidth: 2
    }]
  },
  options: {
    responsive: true,
    scales: {
      x: { title:{display:true,text:"Time (min)"} },
      y: { title:{display:true,text:"Temp (°C)"} }
    },
    plugins: {
      annotation: { annotations: {} }
    }
  }
});

function startRoast() {
  times = [];
  temps = [];
  startTime = Date.now();
  chargeTime = 0;

  timer = setInterval(() => {
    let t = (Date.now() - startTime)/1000;
    let temp = Math.random()*3 + (temps[temps.length-1]||120); // 仮温度

    times.push(t);
    temps.push(temp);

    roastChart.data.labels = times.map(x=>(x/60).toFixed(2));
    roastChart.data.datasets[0].data = temps;
    roastChart.update();
  }, 1000);
}

function markTP(){ tpTime = getTime(); }
function markDryEnd(){ dryEndTime = getTime(); updatePhase(); }
function markFC(){ fcTime = getTime(); updatePhase(); }
function markDrop(){ dropTime = getTime(); clearInterval(timer); updatePhase(); }

function getTime(){ return (Date.now()-startTime)/1000; }

function updatePhase() {
  if(!chargeTime||!dryEndTime||!fcTime||!dropTime) return;

  let dry = dryEndTime - chargeTime;
  let mai = fcTime - dryEndTime;
  let dev = dropTime - fcTime;
  let total = dropTime - chargeTime;
  let devRatio = (dev/total*100).toFixed(1);

  document.getElementById("phaseInfo").innerHTML =
  `Dry ${(dry/60).toFixed(2)}m<br>
   Maillard ${(mai/60).toFixed(2)}m<br>
   Dev ${(dev/60).toFixed(2)}m<br>
   Dev Ratio ${devRatio}%`;

  roastChart.options.plugins.annotation.annotations = {
    dryEndLine:{
      type:'line',
      xMin: dryEndTime/60,
      xMax: dryEndTime/60,
      borderColor:'orange',
      borderWidth:2,
      label:{enabled:true,content:'Dry End'}
    },
    fcLine:{
      type:'line',
      xMin: fcTime/60,
      xMax: fcTime/60,
      borderColor:'red',
      borderWidth:2,
      label:{enabled:true,content:'1st Crack'}
    }
  };
  roastChart.update();
}
</script>

</body>
</html>
