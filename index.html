<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">

<title>Roast Logger Pro</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-annotation@3.0.1"></script>

<style>
body{margin:0;font-family:-apple-system;background:#fafafa}
#container{min-height:100vh}
#chartWrap{height:45vh}
button,input,select{width:100%;padding:12px;margin:6px 0;font-size:16px}
.row{display:flex;gap:6px}
.row>*{flex:1}
#dropBtn{background:#d32f2f;color:#fff;font-weight:bold}
#time{text-align:center;font-size:22px;margin:6px 0}
#phaseText{text-align:center;font-size:18px;font-weight:bold;padding:6px;border-bottom:2px solid #000;background:#fff}

body.ipad #container{display:flex;flex-direction:row;height:100vh}
body.ipad #chartWrap{flex:1.2;height:60vh}
body.ipad #panel{flex:1;overflow-y:auto;padding-left:10px;background:#fff}

#logTableWrap,#eventTableWrap{max-height:20vh;overflow-y:auto;background:#fff;border-top:2px solid #000}
table{width:100%;border-collapse:collapse;font-size:12px}
th,td{border:1px solid #444;padding:2px 4px;text-align:center}
thead{position:sticky;top:0;background:#000;color:#fff}
</style>
</head>

<body>
<div id="container">

<div id="chartWrap"><canvas id="chart"></canvas></div>
<div id="phaseText"></div>

<div id="logTableWrap">
<table id="logTable">
<thead><tr><th>Time</th><th>Temp</th><th>Gas</th><th>RoR</th></tr></thead>
<tbody></tbody>
</table>
</div>

<div id="eventTableWrap">
<table id="eventTable">
<thead><tr><th>Event</th><th>Time</th><th>Temp</th><th>Gas</th></tr></thead>
<tbody></tbody>
</table>
</div>

<div id="panel">
<div id="time">0:00</div>

<label>開始温度</label>
<input id="startTempInput" type="number" value="150">
<button id="startBtn">焙煎開始</button>

<label>豆温</label>
<div class="row">
<input id="tempInput" type="number" value="150">
<button id="tempSet">決定</button>
</div>

<label>Gas</label>
<div class="row">
<button id="gasDown">−</button>
<div id="gasLabel" style="text-align:center;font-size:20px">2.5</div>
<button id="gasUp">＋</button>
</div>
<input id="gasInput" type="number" step="0.1" value="2.5">
<button id="gasSet">決定</button>

<button id="chargeBtn">Charge</button>
<button id="dryBtn">Dry End（長押し）</button>
<button id="fcBtn">1st Crack（長押し）</button>
<button id="dropBtn">DROP</button>
</div>

<script>
/* ===== Device判定 ===== */
const isIPad = navigator.userAgent.includes("iPad") || (navigator.platform==="MacIntel" && navigator.maxTouchPoints>1);
document.body.classList.add(isIPad?"ipad":"iphone");

/* util */
const fmt=s=>`${Math.floor(s/60)}:${String(s%60).padStart(2,"0")}`;
const secToMinSec=fmt;

/* 状態 */
let startTime=null,endTime=null,timer=null;
let temp=150,gas=2.5;
let chargeTime=null,dryTime=null,fcTime=null,dropTime=null;
const tempData=[],gasData=[],rorData=[];
const nowSec=()=>endTime ?? Math.floor((Date.now()-startTime)/1000);

/* Chart */
const chart=new Chart(document.getElementById("chart"),{
 type:"line",
 data:{datasets:[
  {label:"Temp",data:[],borderWidth:2,pointRadius:0},
  {label:"RoR",data:[],yAxisID:"yRoR",borderWidth:2,pointRadius:0},
  {label:"Gas",data:[],yAxisID:"yR",borderDash:[4,4]}
 ]},
 options:{
  animation:false,
  scales:{
   x:{type:"linear",min:0,ticks:{stepSize:60,callback:v=>`${Math.floor(v/60)}:00`}},
   y:{min:0,max:260},
   yR:{position:"right",min:0,max:5},
   yRoR:{position:"right",min:0,max:40,offset:true}
  }
 }
});

/* RoR */
function calcRoR(){
 rorData.length=0;
 for(let i=1;i<tempData.length;i++){
  const p=tempData[i-1],c=tempData[i];
  const dt=c.x-p.x;if(dt<=0)continue;
  rorData.push({x:c.x,y:((c.y-p.y)*(60/dt)).toFixed(1)});
 }
}

/* フェーズ比率 */
function calcPhaseRatio(){
 if(!chargeTime||!dryTime||!fcTime||!dropTime)return null;
 const drying=dryTime-chargeTime;
 const mai=fcTime-dryTime;
 const dev=dropTime-fcTime;
 const total=dropTime-chargeTime;
 const pct=n=>(n/total*100).toFixed(1);
 return {
  d:pct(drying),m:pct(mai),v:pct(dev),
  dt:secToMinSec(drying),mt:secToMinSec(mai),vt:secToMinSec(dev),tt:secToMinSec(total)
 };
}

/* ログ表 */
function updateLogTable(){
 const tb=document.querySelector("#logTable tbody");
 tb.innerHTML="";
 for(let s=0;s<=nowSec();s+=60){
  const t=[...tempData].reverse().find(d=>d.x<=s);
  const g=[...gasData].reverse().find(d=>d.x<=s);
  const r=[...rorData].reverse().find(d=>d.x<=s);
  tb.innerHTML+=`<tr><td>${secToMinSec(s)}</td><td>${t?.y||""}</td><td>${g?.y||""}</td><td>${r?.y||""}</td></tr>`;
 }
}

/* イベント */
function addEvent(name){
 const tb=document.querySelector("#eventTable tbody");
 tb.innerHTML+=`<tr><td>${name}</td><td>${secToMinSec(nowSec())}</td><td>${temp}</td><td>${gas}</td></tr>`;
}

/* 描画 */
function draw(){
 if(!startTime)return;
 const t=nowSec();
 time.textContent=fmt(t);
 chart.options.scales.x.max=Math.max(600,t+10);
 calcRoR();
 chart.data.datasets[0].data=tempData;
 chart.data.datasets[1].data=rorData;
 chart.data.datasets[2].data=gasData;

 chart.options.plugins={annotation:{annotations:{}}};
 const line=(k,x,l,c)=>{if(x!=null)chart.options.plugins.annotation.annotations[k]={type:"line",xMin:x,xMax:x,borderColor:c,label:{display:true,content:l}}};
 line("charge",chargeTime,"Charge","blue");
 line("dry",dryTime,"Dry","orange");
 line("fc",fcTime,"FC","red");
 line("drop",dropTime,"Drop","black");

 updateLogTable();

 const r=calcPhaseRatio();
 const p=document.getElementById("phaseText");
 p.innerHTML=r?`Dry ${r.d}% (${r.dt}) ｜ Maillard ${r.m}% (${r.mt}) ｜ Dev ${r.v}% (${r.vt})<br>Total ${r.tt}`:"";

 chart.update();
}

/* ===== 操作 ===== */
startBtn.onclick=()=>{
 startTime=Date.now();endTime=null;
 chargeTime=dryTime=fcTime=dropTime=null;
 tempData.length=gasData.length=rorData.length=0;
 document.querySelector("#eventTable tbody").innerHTML="";
 temp=parseInt(startTempInput.value)||150;
 tempData.push({x:0,y:temp});
 gasData.push({x:0,y:gas});
 clearInterval(timer);
 timer=setInterval(draw,1000);
 draw();
};

tempSet.onclick=()=>{
 temp=parseInt(tempInput.value)||temp;
 tempData.push({x:nowSec(),y:temp});
 draw();
};

const setGas=v=>{
 gas=Math.min(5,Math.max(0,Number(v.toFixed(1))));
 gasLabel.textContent=gas;gasInput.value=gas;
 gasData.push({x:nowSec(),y:gas});
 addEvent("Gas");
 draw();
};
gasUp.onclick=()=>setGas(gas+0.1);
gasDown.onclick=()=>setGas(gas-0.1);
gasSet.onclick=()=>setGas(parseFloat(gasInput.value));

chargeBtn.onclick=()=>{chargeTime=nowSec();addEvent("Charge");};
let hold;
dryBtn.onpointerdown=()=>hold=setTimeout(()=>{dryTime=nowSec();addEvent("Dry");},700);
dryBtn.onpointerup=()=>clearTimeout(hold);
fcBtn.onpointerdown=()=>hold=setTimeout(()=>{fcTime=nowSec();addEvent("FC");},700);
fcBtn.onpointerup=()=>clearTimeout(hold);

dropBtn.onclick=()=>{dropTime=nowSec();endTime=dropTime;addEvent("Drop");clearInterval(timer);draw();};
</script>
</body>
</html>
