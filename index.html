<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Roast Logger Pro R101</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
body{margin:0;font-family:sans-serif;background:#111;color:#fff}
#wrap{max-width:1100px;margin:auto;padding:10px}
h2{text-align:center}
button,input{font-size:16px;padding:10px;border-radius:6px;border:none}
button{background:#444;color:white}
button:active{background:#666}
.row{display:flex;gap:6px;margin-bottom:6px}
#chartWrap{height:300px}
table{width:100%;border-collapse:collapse;font-size:12px}
th,td{border:1px solid #555;padding:3px;text-align:center}
th{background:#333}
#bottomSpace{height:100px} /* iPhone押しやすさ対策 */
</style>
</head>

<body>
<div id="wrap">
<h2>🔥 Roast Logger Pro R101</h2>

<div id="chartWrap"><canvas id="chart"></canvas></div>

<div class="row">
<button id="startBtn">START</button>
<button id="stopBtn">STOP</button>
<div id="time">0:00</div>
</div>

<!-- Temperature Input -->
<div class="row">
<input id="tempInput" type="number" placeholder="Temp">
<button id="addTemp">ADD</button>
</div>

<!-- Gas -->
<label>Gas</label>
<div class="row">
<button id="gasDown">−</button>
<div id="gasLabel">0.0</div>
<button id="gasUp">＋</button>
</div>

<!-- Damper -->
<label>Damper</label>
<div class="row">
<button id="damperDown">−</button>
<div id="damperLabel">0</div>
<button id="damperUp">＋</button>
</div>

<!-- Events -->
<div class="row">
<button id="tpBtn">TP</button>
<button id="deBtn">Dry End</button>
<button id="fcBtn">1C</button>
<button id="dropBtn">Drop</button>
</div>

<h3>Event Log</h3>
<table id="eventTable">
<thead>
<tr><th>Event</th><th>Time</th><th>Temp</th><th>Gas</th><th>Damper</th></tr>
</thead>
<tbody></tbody>
</table>

<h3>Phase Ratio</h3>
<div id="phaseInfo"></div>

<div id="bottomSpace"></div>
</div>

<script>
let ctx=document.getElementById("chart");
let chart=new Chart(ctx,{
type:"line",
data:{labels:[],datasets:[
{label:"Temp",data:[],borderColor:"red",borderWidth:2,tension:0.2},
{label:"RoR",data:[],borderColor:"yellow",borderWidth:1,yAxisID:"y1"},
]},
options:{
scales:{
y:{title:{display:true,text:"Temp"}},
y1:{position:"right",title:{display:true,text:"RoR"},grid:{drawOnChartArea:false}}
}
}
});

let startTime=0,timer=null,temp=0,gas=0,damper=0;
let temps=[],times=[],ror=[];
let events={tp:null,de:null,fc:null,drop:null};

const nowSec=()=>((Date.now()-startTime)/1000);
const secToMinSec=s=>{
 let m=Math.floor(s/60),sec=Math.floor(s%60);
 return m+":"+sec.toString().padStart(2,"0");
};

function addEventLog(name){
 let tbody=document.querySelector("#eventTable tbody");
 let tr=document.createElement("tr");
 tr.innerHTML=`<td>${name}</td><td>${secToMinSec(nowSec())}</td><td>${temp}</td><td>${gas}</td><td>${damper}</td>`;
 tbody.appendChild(tr);
}

function calcRoR(){
 if(temps.length<2) return 0;
 let dt=times[times.length-1]-times[times.length-2];
 if(dt<=0) return 0;
 return (temps[temps.length-1]-temps[temps.length-2])/(dt/60);
}

function updatePhase(){
 if(events.tp&&events.de&&events.fc&&events.drop){
 let dry=events.de-events.tp;
 let maillard=events.fc-events.de;
 let dev=events.drop-events.fc;
 let total=events.drop-events.tp;
 phaseInfo.innerHTML=
 `Dry:${(dry/total*100).toFixed(1)}%<br>
 Maillard:${(maillard/total*100).toFixed(1)}%<br>
 Dev:${(dev/total*100).toFixed(1)}%`;
 }
}

startBtn.onclick=()=>{
 startTime=Date.now();
 chart.data.labels=[];chart.data.datasets[0].data=[];chart.data.datasets[1].data=[];
 temps=[];times=[];ror=[];
 events={tp:null,de:null,fc:null,drop:null};
 document.querySelector("#eventTable tbody").innerHTML="";
 timer=setInterval(()=>{
  time.textContent=secToMinSec(nowSec());
 },1000);
};

stopBtn.onclick=()=>clearInterval(timer);

addTemp.onclick=()=>{
 temp=parseFloat(tempInput.value);
 let t=nowSec();
 temps.push(temp);
 times.push(t);
 let r=calcRoR();
 ror.push(r);

 chart.data.labels.push(secToMinSec(t));
 chart.data.datasets[0].data.push(temp);
 chart.data.datasets[1].data.push(r);
 chart.update();
};

gasUp.onclick=()=>{gas+=0.1;gasLabel.textContent=gas.toFixed(1);addEventLog("Gas");}
gasDown.onclick=()=>{gas=Math.max(0,gas-0.1);gasLabel.textContent=gas.toFixed(1);addEventLog("Gas");}

damperUp.onclick=()=>{damper=Math.min(8,damper+1);damperLabel.textContent=damper;addEventLog("Damper");}
damperDown.onclick=()=>{damper=Math.max(0,damper-1);damperLabel.textContent=damper;addEventLog("Damper");}

tpBtn.onclick=()=>{events.tp=nowSec();addEventLog("TP");}
deBtn.onclick=()=>{events.de=nowSec();addEventLog("Dry End");updatePhase();}
fcBtn.onclick=()=>{events.fc=nowSec();addEventLog("First Crack");updatePhase();}
dropBtn.onclick=()=>{events.drop=nowSec();addEventLog("Drop");updatePhase();}
</script>
</body>
</html>
