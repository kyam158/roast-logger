<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Roast Logger Pro FujiRoyal 1kg</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-annotation@3.0.1"></script>

<style>
body{margin:0;font-family:-apple-system;background:#fafafa}
#container{min-height:100vh}
#chartWrap{height:45vh}
button,input,select{width:100%;padding:12px;margin:6px 0;font-size:16px}
.row{display:flex;gap:6px}
.row>*{flex:1}
#dropBtn{background:#d32f2f;color:#fff;font-weight:bold}
#csvBtn{background:#1976d2;color:#fff}
#time{text-align:center;font-size:22px;margin:6px 0}
#phaseText{text-align:center;font-size:16px;font-weight:bold}
button{touch-action:manipulation}

body.ipad #container{display:flex;height:100vh}
body.ipad #chartWrap{flex:1.2;height:60vh}
body.ipad #panel{flex:1;overflow:auto;padding-left:10px;background:#fff}

#logTableWrap,#eventTableWrap{max-height:20vh;overflow:auto;background:#fff;margin-top:8px}
table{width:100%;border-collapse:collapse;font-size:12px}
th,td{border:1px solid #444;padding:2px;text-align:center}
thead{position:sticky;top:0;background:#000;color:#fff}

#bottomSpacer{height:120px}
</style>
</head>

<body>
<div id="container">

<div id="chartWrap"><canvas id="chart"></canvas></div>
<div id="phaseText">Phase: waiting...</div>

<div id="logTableWrap">
<table id="logTable">
<thead><tr><th>Time</th><th>Temp</th><th>Gas</th><th>Air</th><th>RoR</th></tr></thead>
<tbody></tbody>
</table>
</div>

<div id="eventTableWrap">
<table id="eventTable">
<thead><tr><th>Event</th><th>Time</th><th>Temp</th><th>Gas</th><th>Air</th></tr></thead>
<tbody></tbody>
</table>
</div>

<div id="panel">
<div id="time">0:00</div>

<label>開始温度</label>
<input id="startTempInput" type="number" value="150">
<button id="startBtn">焙煎開始</button>

<label>豆温</label>
<div class="row">
<input id="tempInput" type="number" value="150">
<button id="tempSet">決定</button>
</div>

<label>Gas</label>
<div class="row">
<button id="gasDown">−</button>
<div id="gasLabel">2.5</div>
<button id="gasUp">＋</button>
</div>
<div class="row">
<input id="gasInput" type="number" step="0.1" value="2.5">
<button id="gasSet">決定</button>
</div>

<label>Air</label>
<div class="row">
<button id="airDown">−</button>
<div id="airLabel">0.0</div>
<button id="airUp">＋</button>
</div>
<div class="row">
<input id="airInput" type="number" step="0.1" value="0.0">
<button id="airSet">決定</button>
</div>

<button id="tpBtn">Turning Point</button>
<button id="dryBtn">Dry End（長押し）</button>
<button id="fcBtn">1st Crack（長押し）</button>
<button id="dropBtn">DROP</button>

<button id="csvBtn">CSV Export</button>
<input id="loadCsv" type="file" accept=".csv">
<select id="historySelect"><option value="">履歴</option></select>

<h3>Green Bean Info</h3>
<label>日付</label><input id="metaDate" type="date">
<label>国</label><input id="metaCountry">
<label>農園</label><input id="metaFarm">
<label>品種</label><input id="metaVariety">
<label>プロセス</label><input id="metaProcess">
<label>標高</label><input id="metaAltitude">
</div>

<div id="bottomSpacer"></div>

<script>
Chart.register(window['chartjs-plugin-annotation']);
const fmt=s=>`${Math.floor(s/60)}:${String(s%60).padStart(2,"0")}`;

// ===== 状態 =====
let startTime=null,endTime=null,timer=null;
let temp=150,gas=2.5,air=0;
const tempData=[],gasData=[],airData=[],rorData=[];
let tpTime=null,dryTime=null,fcTime=null,dropTime=null;

// logs
const minuteLog=[],eventLog=[];
let lastMinuteLogged=-1;
const nowSec=()=>endTime ?? Math.floor((Date.now()-startTime)/1000);

// ===== Chart =====
const chart=new Chart(document.getElementById("chart"),{
 type:"line",
 data:{datasets:[
  {label:"Temp",data:[],borderColor:"red",borderWidth:2,pointRadius:0},
  {label:"RoR",data:[],yAxisID:"yRoR",borderColor:"blue",borderWidth:2,pointRadius:0},
  {label:"Gas",data:[],yAxisID:"yGas",borderColor:"green",borderDash:[4,4],pointRadius:0},
  {label:"Air",data:[],yAxisID:"yAir",borderColor:"cyan",borderDash:[2,2],pointRadius:0}
 ]},
 options:{
  animation:false,
  scales:{
   x:{type:"linear",ticks:{callback:v=>fmt(v)}},
   y:{min:0,max:260},
   yRoR:{position:"right",min:0,max:40},
   yGas:{position:"right",min:0,max:5,offset:true},
   yAir:{position:"right",min:0,max:10,offset:true}
  },
  plugins:{annotation:{annotations:{}}}
 }
});

// ===== RoR =====
function calcRoR(){
 rorData.length=0;
 for(let i=1;i<tempData.length;i++){
  const p=tempData[i-1],c=tempData[i];
  const dt=c.x-p.x;if(dt<=0)continue;
  rorData.push({x:c.x,y:+((c.y-p.y)*60/dt).toFixed(1)});
 }
}

// ===== フェーズ比率 =====
function calcPhaseRatio(){
 if(!tpTime||!dryTime||!fcTime||!dropTime)return null;
 const drying=dryTime-tpTime,maillard=fcTime-dryTime,dev=dropTime-fcTime;
 const total=dropTime-tpTime;
 const pct=n=>(n/total*100).toFixed(1);
 return{drying,maillard,dev,
 dryingTime:fmt(drying),maillardTime:fmt(maillard),devTime:fmt(dev),
 dryingPct:pct(drying),maillardPct:pct(maillard),devPct:pct(dev)};
}

// ===== 描画 =====
function draw(){
 if(!startTime)return;
 const t=nowSec();
 time.textContent=fmt(t);
 calcRoR();
 chart.data.datasets[0].data=tempData;
 chart.data.datasets[1].data=rorData;
 chart.data.datasets[2].data=gasData;
 chart.data.datasets[3].data=airData;
 chart.options.scales.x.max=Math.max(600,t+10);

 const ann=chart.options.plugins.annotation.annotations={};
 const add=(k,t,l,c)=>{if(t!=null)ann[k]={type:"line",xMin:t,xMax:t,borderColor:c,borderWidth:2,label:{display:true,content:l}}};
 add("tp",tpTime,"TP","purple");
 add("dry",dryTime,"Dry","orange");
 add("fc",fcTime,"1C","red");
 add("drop",dropTime,"Drop","black");

 const ratio=calcPhaseRatio();
 phaseText.innerHTML=ratio?
 `Dry ${ratio.dryingTime} (${ratio.dryingPct}%) | Maillard ${ratio.maillardTime} (${ratio.maillardPct}%) | Dev ${ratio.devTime} (${ratio.devPct}%)`
 :"Phase: waiting...";

 chart.update();
}

// ===== 操作 =====
startBtn.onclick=()=>{
 startTime=Date.now();endTime=null;
 tempData.length=gasData.length=airData.length=rorData.length=0;
 tpTime=dryTime=fcTime=dropTime=null;
 temp=+startTempInput.value||150;
 tempData.push({x:0,y:temp});
 gasData.push({x:0,y:gas});
 airData.push({x:0,y:air});
 clearInterval(timer);
 timer=setInterval(draw,1000);
 draw();
};

tempSet.onclick=()=>{temp=+tempInput.value;tempData.push({x:nowSec(),y:temp});draw();};
const setGas=v=>{gas=Math.max(0,Math.min(5,v));gasLabel.textContent=gas.toFixed(1);gasInput.value=gas;gasData.push({x:nowSec(),y:gas});draw();};
gasUp.onclick=()=>setGas(gas+0.1);gasDown.onclick=()=>setGas(gas-0.1);gasSet.onclick=()=>setGas(+gasInput.value);

const setAir=v=>{air=Math.max(0,v);airLabel.textContent=air.toFixed(1);airInput.value=air;airData.push({x:nowSec(),y:air});draw();};
airUp.onclick=()=>setAir(air+0.1);airDown.onclick=()=>setAir(air-0.1);airSet.onclick=()=>setAir(+airInput.value);

let hold=null;
const holdStart=f=>hold=setTimeout(f,600);
const holdCancel=()=>clearTimeout(hold);
dryBtn.onpointerdown=e=>{e.preventDefault();holdStart(()=>dryTime=nowSec());};
fcBtn.onpointerdown=e=>{e.preventDefault();holdStart(()=>fcTime=nowSec());};
[dryBtn,fcBtn].forEach(b=>b.onpointerup=holdCancel);

tpBtn.onclick=()=>tpTime=nowSec();
dropBtn.onclick=()=>{dropTime=nowSec();endTime=dropTime;clearInterval(timer);draw();saveHistory();};

// ===== 履歴保存 =====
function saveHistory(){
 const h=JSON.parse(localStorage.getItem("roastHistory")||"[]");
 h.push({
  tempData,gasData,airData,rorData,tpTime,dryTime,fcTime,dropTime,
  meta:{
   date:metaDate.value,country:metaCountry.value,farm:metaFarm.value,
   variety:metaVariety.value,process:metaProcess.value,altitude:metaAltitude.value
  }
 });
 localStorage.setItem("roastHistory",JSON.stringify(h));
 updateHistory();
}
function updateHistory(){
 const h=JSON.parse(localStorage.getItem("roastHistory")||"[]");
 historySelect.innerHTML='<option value="">履歴</option>';
 h.forEach((_,i)=>{
  const o=document.createElement("option");
  o.value=i;o.textContent=`Roast ${i+1}`;
  historySelect.appendChild(o);
 });
}
historySelect.onchange=()=>{
 const h=JSON.parse(localStorage.getItem("roastHistory"));
 const r=h[historySelect.value]; if(!r)return;
 Object.assign(tempData,r.tempData);Object.assign(gasData,r.gasData);
 Object.assign(airData,r.airData);Object.assign(rorData,r.rorData);
 tpTime=r.tpTime;dryTime=r.dryTime;fcTime=r.fcTime;dropTime=r.dropTime;
 if(r.meta){metaDate.value=r.meta.date||"";metaCountry.value=r.meta.country||"";}
 startTime=Date.now();draw();
};

// ===== CSV Export =====
csvBtn.onclick=()=>{
 let csv=["# Roast Logger"];
 const ratio=calcPhaseRatio();
 if(ratio){
  csv.push(`# DryingTime,${ratio.dryingTime}`);
  csv.push(`# MaillardTime,${ratio.maillardTime}`);
  csv.push(`# DevTime,${ratio.devTime}`);
  csv.push(`# DryingRate,${ratio.dryingPct}%`);
  csv.push(`# MaillardRate,${ratio.maillardPct}%`);
  csv.push(`# DevRate,${ratio.devPct}%`);
 }
 csv.push("Time,Temp,Gas,Air,RoR");
 tempData.forEach(t=>{
  const g=gasData.find(d=>d.x==t.x);
  const a=airData.find(d=>d.x==t.x);
  const r=rorData.find(d=>d.x==t.x);
  csv.push(`${fmt(t.x)},${t.y},${g?g.y:""},${a?a.y:""},${r?r.y:""}`);
 });
 const blob=new Blob([csv.join("\n")],{type:"text/csv"});
 const url=URL.createObjectURL(blob);
 const a=document.createElement("a");a.href=url;a.download="roast.csv";a.click();
};
</script>
</body>
</html>
